<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SOMA — Biometric Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,200..700,0..100&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <header class="bar">
    <div class="bar__brand">
      <svg class="bar__sig" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="0.6"/>
        <path d="M4 16h4l3-8 5 16 3-8 3 4h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span class="bar__name">SOMA</span>
      <span class="bar__tag">Biometric Canvas</span>
    </div>

    <!-- Session manifest: 5 dots, one per check -->
    <div class="manifest" id="manifest" aria-label="Session progress">
      <div class="manifest__dot" data-test="memory"    title="Cognitive">01</div>
      <div class="manifest__dot" data-test="breath"    title="Breath">02</div>
      <div class="manifest__dot" data-test="bmi"       title="Composition">03</div>
      <div class="manifest__dot" data-test="reaction"  title="Reaction">04</div>
      <div class="manifest__dot" data-test="stillness" title="Stillness">05</div>
    </div>

    <div class="bar__right">
      <span class="bar__clock" id="session-clock">00:00</span>
      <button class="bar__reset" id="reset" type="button">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M3 10a7 7 0 1 0 2-5L3 3v4h4"/>
        </svg>
        Reset
      </button>
    </div>
  </header>

  <main class="stage">

    <!-- ─── LEFT: 3D canvas ─────────────────────────────── -->
    <section class="canvas-col" id="canvas-col">

      <!-- Three.js appends <canvas> here -->
      <div class="viewport" id="viewport">

        <!-- Loading -->
        <div class="loader" id="loader">
          <div class="loader__ring">
            <svg viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="32" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 4"/>
              <circle cx="40" cy="40" r="20" fill="none" stroke="currentColor" stroke-width="0.5"/>
              <line x1="40" y1="8"  x2="40" y2="72" stroke="currentColor" stroke-width="0.4"/>
              <line x1="8"  y1="40" x2="72" y2="40" stroke="currentColor" stroke-width="0.4"/>
            </svg>
          </div>
          <p class="loader__msg" id="loader-msg">Preparing figure…</p>
          <div class="loader__track"><div class="loader__fill" id="loader-fill"></div></div>
          <p class="loader__pct" id="loader-pct">0 %</p>
        </div>

        <!-- Floating region pins (HTML, positioned via JS every frame) -->
        <div class="pins" id="pins">
          <button class="pin" data-test="memory"    type="button"><span class="pin__n">i</span><span class="pin__l">Cognitive</span></button>
          <button class="pin" data-test="breath"    type="button"><span class="pin__n">ii</span><span class="pin__l">Breath</span></button>
          <button class="pin" data-test="bmi"       type="button"><span class="pin__n">iii</span><span class="pin__l">Composition</span></button>
          <button class="pin" data-test="reaction"  type="button"><span class="pin__n">iv</span><span class="pin__l">Reaction</span></button>
          <button class="pin" data-test="stillness" type="button"><span class="pin__n">v</span><span class="pin__l">Stillness</span></button>
        </div>

        <!-- Scan line (ambient) -->
        <div class="scanline" aria-hidden="true"></div>

        <!-- Bottom legend -->
        <div class="legend">
          <span><kbd>Drag</kbd> orbit</span>
          <span class="legend__sep">·</span>
          <span><kbd>Scroll</kbd> zoom</span>
          <span class="legend__sep">·</span>
          <span><kbd>2×click</kbd> reset view</span>
        </div>
      </div>

    </section>

    <!-- ─── RIGHT: Test panel ───────────────────────────── -->
    <section class="panel" id="panel" aria-live="polite">
      <!-- filled by app.js -->
    </section>

  </main>

  <script src="app.js"></script>
  <script type="module" src="body3d.js"></script>
</body>
</html>
